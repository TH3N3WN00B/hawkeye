# The version is computed in build.gradle.kts (year.quarter); a release passes -Pversion=26.4.

# Build speed (docs/knowledge/README.md "Build facts").
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# The Minecraft versions a Modrinth upload lists: every version from api-version (paperOldest) to the newest paper-api
# that Modrinth knows. Move it with paperOldest and paper (docs/knowledge/README.md "Release facts").
modrinth.gameVersions=1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11,26.1,26.1.1,26.1.2,26.2,26.3
