name: Update Modrinth Description

# Copies MODRINTH.md into the Modrinth project's description. A published release does it when MODRINTH.md
# changed since the previous release tag (or on the first release); running the workflow by hand does it
# from the chosen branch every time. Secrets: MODRINTH_TOKEN (a Modrinth personal access token; this workflow needs
# "Write projects", and the version uploads "Read projects" and "Create versions") and, optionally,
# MODRINTH_PROJECT_ID (defaults to the slug hawkeye).

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    name: Update Description
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      MODRINTH_FALLBACK_PROJECT: hawkeye

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Check for Modrinth description changes
        id: changes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ ! -f MODRINTH.md ]; then
            echo "MODRINTH.md does not exist on ${GITHUB_REF}; skipping."
            echo "should_update=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Run by hand; updating the Modrinth description from MODRINTH.md on ${GITHUB_REF_NAME}."
            echo "should_update=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"

          if [ -z "${previous_tag}" ]; then
            echo "No previous tag found; updating the Modrinth description from MODRINTH.md."
            echo "should_update=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Checking MODRINTH.md changes between ${previous_tag} and ${RELEASE_TAG}."
          if git diff --name-only "${previous_tag}" "${RELEASE_TAG}" -- MODRINTH.md | grep -qx 'MODRINTH.md'; then
            echo "MODRINTH.md changed in this release."
            echo "should_update=true" >> "${GITHUB_OUTPUT}"
          else
            echo "MODRINTH.md did not change in this release; skipping."
            echo "should_update=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate Modrinth configuration
        if: steps.changes.outputs.should_update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::error title=Missing secret::The MODRINTH_TOKEN repository secret is required."
            exit 1
          fi

      - name: Build Modrinth API payload
        if: steps.changes.outputs.should_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq --raw-input --slurp '{body: .}' MODRINTH.md > "${RUNNER_TEMP}/modrinth-description.json"

      - name: Update Modrinth description
        if: steps.changes.outputs.should_update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          project_id="${MODRINTH_PROJECT_ID:-${MODRINTH_FALLBACK_PROJECT}}"
          response_file="$(mktemp)"
          http_status="$(
            curl --silent --show-error --output "${response_file}" --write-out "%{http_code}" \
              --request PATCH \
              --url "https://api.modrinth.com/v2/project/${project_id}" \
              --header "Authorization: ${MODRINTH_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "User-Agent: ${GITHUB_REPOSITORY} GitHub Actions (https://github.com/${GITHUB_REPOSITORY})" \
              --data "@${RUNNER_TEMP}/modrinth-description.json"
          )"

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error title=Modrinth API::The request failed with HTTP ${http_status}."
            cat "${response_file}" >&2
            exit 1
          fi

          echo "Updated the Modrinth description of ${project_id}."
