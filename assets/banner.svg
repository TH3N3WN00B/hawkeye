  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="96" y="112" width="96" height="96" rx="21" fill="#db2777"/>
    <text x="144" y="160" dy="0.35em" text-anchor="middle" font-size="48" font-weight="600" fill="#ffffff">H</text>
    <text x="224" y="160" dy="0.35em" font-size="88" font-weight="700" fill="#fafafa">Hawkeye</text>
    <text x="96" y="290" font-size="36" font-weight="500" fill="#e4e4e7">Block logging, rollbacks and network sync</text>
    <text x="96" y="340" font-size="36" font-weight="500" fill="#e4e4e7">for Paper and Folia</text>
    <text x="96" y="400" font-size="26" fill="#a1a1aa">1.21.1 to 26.3 · SQLite · MySQL · MariaDB · PostgreSQL</text>
  </g>
</svg>
