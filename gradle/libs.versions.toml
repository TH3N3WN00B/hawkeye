[versions]
shadow = "9.6.1"
paper = "26.3.build.249-stable"
lombok = "1.18.48"
jetbrainsAnnotations = "26.1.0"

# Moonrise plugin-engine and the runtime libraries its loader resolves (PaperPluginLoader defaults).
# Keep these five in step with the engine: the plugin compiles against them, the server runs the loader's.
engine = "1.10.1"
mossPaper = "1.2.2"
springContext = "6.2.13"
jakarta = "3.0.0"
cloudPaper = "2.0.1"
cloudAnnotations = "2.0.0"
configLib = "4.8.1"

# Testing
junitJupiter = "6.1.3"
junitPlatformLauncher = "6.1.3"
mockbukkit = "4.120.0"
archunit = "1.5.1"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jetbrainsAnnotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }

# Engine (Moonrise)
engine = { module = "gg.moonrise.engine:plugin-engine-paper", version.ref = "engine" }
mossPaper = { module = "gg.moonrise.moss:moss-paper", version.ref = "mossPaper" }

# Spring
springContext = { module = "org.springframework:spring-context", version.ref = "springContext" }
jakarta = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta" }

# Cloud Command Framework
cloudPaper = { module = "org.incendo:cloud-paper", version.ref = "cloudPaper" }
cloudAnnotations = { module = "org.incendo:cloud-annotations", version.ref = "cloudAnnotations" }

configLib = { module = "de.exlll:configlib-yaml", version.ref = "configLib" }

# Testing
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[bundles]
# Resolved by the engine's PaperPluginLoader at server start: compileOnly for main, on the test class path.
engineRuntime = ["mossPaper", "springContext", "jakarta", "cloudPaper", "cloudAnnotations", "configLib"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
